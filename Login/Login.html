<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Login</title>

    <style>
        body{
            background-color: #121212;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .contenedor{
            background-color: #181818;
            width: 300px;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: white;
        }

        h1{
            color: #1DB954;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
        }

        button{
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover{
            background-color: #1ed760;
        }

        p{
            font-size: 12px;
            margin-top: 15px;
        }

        a{
            color: #1DB954;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Spotify</h1>

        <h2>Iniciar Sesión</h2>

        <form>

            <input type="email" placeholder="Correo electrónico">

            <input type="password" placeholder="Contraseña">

            <button type="submit">Entrar</button>

        </form>

        <p>
            ¿No tienes cuenta?
            <a href="#">Regístrate</a>
        </p>

    </div>

</body>
</html>
